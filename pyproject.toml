[project]
name = "pydocx"
version = "1.0.0"
description = "PyDocx — генератор документов из скриптов и текстовой разметки"
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "flet-permission-handler==1.1.2",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.1",
    "lxml>=5.3.0",
]

[dependency-groups]
dev = [
    "flet[all]>=1.1.2",
]

[tool.flet]
org = "com.example"
product = "PyDocx"
company = "Example"
copyright = "Copyright (C) 2026 Example"

[tool.flet.app]
module = "main"
exclude = [
    "node_modules",
    "dist",
    "src",
    "public",
    "server",
    "server.ts",
    "package.json",
    "package-lock.json",
    "bun.lock",
    "tsconfig.json",
    "vite.config.ts",
    "index.html",
    "metadata.json",
]

[tool.flet.android]
target_arch = ["arm64-v8a"]
extract_packages = ["docx", "pptx"]

[tool.flet.android.permission]
"android.permission.MANAGE_EXTERNAL_STORAGE" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.2"
jni_flutter = "1.0.4+1"
path_provider_android = "2.2.23"
